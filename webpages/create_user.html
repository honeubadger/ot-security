<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>OT Security User Creation</title>

<style>

body {
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
}

.create-user-container {
    background: #1e293b;
    padding: 35px;
    border-radius: 15px;
    width: 320px;
    max-width: 90%;
}

h2 {
    color: #38bdf8;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background: #0284c7;
    color: white;
    border: none;
    cursor: pointer;
}

.error {
    color: #f87171;
}

</style>
</head>

<body>

<div class="create-user-container">

<h2>OT SECURITY USER CREATION</h2>

<form method="POST">

<input
    name="username"
    placeholder="Username"
    required
    autocomplete="username">

<input
    name="password"
    type="password"
    placeholder="Password"
    required
    autocomplete="current-password">

<button type="submit">CREATE USER</button>

</form>

<p class="error">{{ error }}</p>

</div>

</body>
</html>
